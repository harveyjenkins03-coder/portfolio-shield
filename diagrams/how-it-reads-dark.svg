<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">How portfolio-shield reads a repository</title><desc id="d">Three inputs (the working folder, every object in .git/objects, and commit headers) pass through one rule set; three hooks run the same rules at commit and push time. Findings name the place and the rule, never the value.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="2" height="2" fill="#262c34"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e09f3e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="12" fill="#181b20" stroke="#323a44" stroke-width="1.5"/><rect x="1" y="1" width="958" height="558" rx="12" fill="url(#dots)"/><text x="32" y="44" font-size="20" font-weight="600" fill="#ece4d6" text-anchor="start">How portfolio-shield reads a repository</text><text x="32" y="68" font-size="14" font-weight="400" fill="#a7afb8" text-anchor="start">One rule set, three inputs, three hooks.</text><rect x="32" y="96" width="270" height="72" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="120" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Working folder</text><text x="46" y="141" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">every file, by name and content</text><rect x="32" y="184" width="270" height="72" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="208" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">.git/objects</text><text x="46" y="229" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">every object, reachable or not</text><rect x="32" y="272" width="270" height="72" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="296" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Commit headers</text><text x="46" y="317" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">author, committer, tagger</text><rect x="366" y="96" width="270" height="248" rx="8" fill="#2c261d" stroke="#e09f3e" stroke-width="1.5"/><text x="380" y="120" font-size="15" font-weight="600" fill="#e09f3e" text-anchor="start">Rules</text><text x="380" y="141" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">deny list, then the allow list</text><text x="380" y="160" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">keys and tokens</text><text x="380" y="179" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">user paths</text><text x="380" y="198" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">private and VPN addresses</text><text x="380" y="217" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">mail addresses</text><text x="380" y="236" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">image metadata</text><text x="380" y="255" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">approved identities</text><text x="380" y="274" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">high entropy (strict)</text><path d="M302,132 L366,132" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M302,220 L366,220" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M302,308 L366,308" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="700" y="96" width="228" height="112" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="714" y="120" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Report</text><text x="714" y="141" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">place and rule,</text><text x="714" y="160" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">never the value</text><text x="714" y="179" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">exit 0, 1 or 2</text><path d="M636,152 L700,152" fill="none" stroke="#e09f3e" stroke-width="1.6" marker-end="url(#aa)"/><rect x="700" y="224" width="228" height="120" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="714" y="248" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">strip</text><text x="714" y="269" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">PNG text chunks</text><text x="714" y="288" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">JPEG EXIF, comments</text><text x="714" y="307" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">SVG editor metadata</text><rect x="32" y="400" width="288" height="92" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="424" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">pre-commit</text><text x="46" y="445" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">staged blobs from the index</text><text x="46" y="464" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">and the identity git will use</text><path d="M176,400 L176,372" fill="none" stroke="#6b7480" stroke-width="1.6"/><rect x="336" y="400" width="288" height="92" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="350" y="424" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">commit-msg</text><text x="350" y="445" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">the message</text><text x="350" y="464" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">before it is written</text><path d="M480,400 L480,372" fill="none" stroke="#6b7480" stroke-width="1.6"/><rect x="640" y="400" width="288" height="92" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="654" y="424" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">pre-push</text><text x="654" y="445" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">every object the push sends</text><text x="654" y="464" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">(github.com remotes)</text><path d="M784,400 L784,372" fill="none" stroke="#6b7480" stroke-width="1.6"/><path d="M176,372 L784,372" fill="none" stroke="#6b7480" stroke-width="1.6"/><path d="M501,372 L501,344" fill="none" stroke="#e09f3e" stroke-width="1.6" marker-end="url(#aa)"/><text x="32" y="532" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">A file deleted three commits ago is still an object. So is the user name in every commit header.</text></svg>
